name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.3.7). Leave blank for a dry-run.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE test, matching the main CI. Several tests assert against `dist/` and return early
      # when it is absent — the edge-safety check, the version surfaces, the canary — so testing first
      # makes the release gate pass having silently skipped the checks that cover what actually ships.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Before publishing anything: does the build about to ship block the exploit the canary is built
      # around? `PS_REQUIRE_CANARY` refuses to skip, because a skipped canary reads as a passing one.
      - name: Canary — the build about to ship blocks the exploit
        run: npx vitest run tests/protect/canary-engine-proof.test.ts
        env:
          PS_REQUIRE_CANARY: '1'

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        run: npm publish --access public --provenance --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: ${{ steps.version.outputs.url }}
    # Exported so the job that records the version on `main` uses the version this job published, rather
    # than resolving the tag a second time and being able to differ from it.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "Publishing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=https://www.npmjs.com/package/@patchstack/connect/v/$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      # The proof that matters most, and the only one that covers PACKAGING. Everything above tests a build
      # in this checkout; this installs the published tarball from the registry and runs the same canary
      # against the engine inside it. A file left out of `files`, a wrong `exports` map, or a bad entry
      # point produces an artifact that passes every local check and cannot protect an application — which
      # is indistinguishable from protection until an attack is not blocked.
      #
      # After the publish rather than before, because the tarball does not exist until then. A failure here
      # cannot unpublish the version; it is a loud signal to deprecate it, which is the honest position:
      # the alternative is not knowing.
      - name: Canary — the PUBLISHED tarball blocks the exploit
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'

          # npm needs a moment before a fresh version resolves; a failure to install here is not a failure
          # of the engine and must not be reported as one.
          for attempt in 1 2 3 4 5; do
            if npm pack "@patchstack/connect@${version}" --pack-destination /tmp >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not fetch @patchstack/connect@${version} from the registry to verify it. The published engine is UNVERIFIED — this is not evidence that it works."
              exit 1
            fi
            sleep 15
          done

          mkdir -p /tmp/published && tar -xzf /tmp/patchstack-connect-"${version}".tgz -C /tmp/published
          engine=/tmp/published/package/dist/protect.js

          if [ ! -f "$engine" ]; then
            echo "::error::The published tarball has no dist/protect.js. Nothing that installs this package can protect anything."
            exit 1
          fi

          PS_CANARY_ENGINE="$engine" PS_REQUIRE_CANARY=1 npx vitest run tests/protect/canary-engine-proof.test.ts

  # The tag is the source of truth for what gets published, and this brings the repository's own copy in
  # line with it afterwards.
  #
  # Both halves matter. Writing the version in CI is what lets a release happen with no pre-commit, which
  # is what makes it work with branch protection. But only the published tarball gets its version from the
  # tag: a git installation, an SBOM built from a checkout, `npm pack` from the repository and
  # `--version` all read the committed manifest. For a package whose purpose is to shield known
  # vulnerabilities, a manifest that names the wrong version means someone believing they have a fix they
  # do not have — so the two must not be allowed to drift.
  #
  # A pull request rather than a push, because branch protection is the point of branch protection. Never
  # auto-merged.
  record-version:
    name: Record the published version on main
    # No event guard. The recommended release path runs `gh workflow run publish.yml`, which arrives as
    # `workflow_dispatch` and not as `release` — so a `release`-only condition skips this job on the very
    # path that publishes most versions, while the workflow still reports success. `needs: publish` is the
    # correct gate on its own: a dry-run dispatch skips `publish`, which skips this with it.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH: chore/record-published-version
      VERSION: ${{ needs.publish.outputs.version }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          # Deliberately the default branch, not the tag: the proposal targets `main`, and checking out
          # the tag would carry every difference between the tag and `main` into the diff.
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Apply the version to the manifest and the lockfile
        id: apply
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::No published version was passed to this job."; exit 1; }

          before=$(node -p 'require("./package.json").version')
          # `npm version` is what writes all three recorded copies (manifest, lockfile top level, lockfile
          # root entry). Doing it by hand is how one of the three gets left behind.
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null

          echo "before=$before" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already records $VERSION."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Evidence for the reviewer, gathered here because it may not be available on the pull request
      # itself: a pull request opened with GITHUB_TOKEN does not start workflow runs. The consistency
      # invariant is the whole content of this change, so it is checked here and the result stated in the
      # body rather than leaving a reviewer to approve two edited strings on trust.
      - name: Check the invariant this change exists to satisfy
        if: steps.apply.outputs.changed == 'true'
        id: verify
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if npx vitest run tests/package-version.test.ts; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=FAILED' >> "$GITHUB_OUTPUT"
            echo "::error::The version surfaces disagree even after applying $VERSION. Do not merge without reading why."
            exit 1
          fi

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Record published version ${{ env.VERSION }}"
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The checkout fetched one ref, so on any run after the first there is no remote-tracking ref
          # for this branch and a bare `--force-with-lease` would refuse the push as stale — opening the
          # pull request once and never updating it again while still reporting success.
          git fetch --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true

          if git rev-parse --verify -q "refs/remotes/origin/$BRANCH" >/dev/null; then
            lease="--force-with-lease=${BRANCH}:$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          else
            # An empty expected value means "expect this branch not to exist" — the honest lease for a
            # first push, and it still refuses to clobber a branch somebody created meanwhile.
            lease="--force-with-lease=${BRANCH}:"
          fi

          git checkout -B "$BRANCH"
          git add package.json package-lock.json
          git commit -m "$TITLE" -m "Prepared automatically after publishing v${VERSION}. Not auto-merged."
          git push "$lease" origin "$BRANCH"

          {
            echo "\`${VERSION}\` is published; \`main\` records \`${{ steps.apply.outputs.before }}\`."
            echo
            echo "The tag is the source of truth for what gets published. This brings the repository's own"
            echo "copy in line, so that a git installation, an SBOM built from a checkout, \`npm pack\` and"
            echo "\`patchstack-connect --version\` all report the released version.
            echo
            echo "Prepared by the \`Publish\` workflow. Two version strings and the lockfile entries \`npm"
            echo "version\` derives from them; no source changes."
            echo
            echo "**Version consistency check: ${{ steps.verify.outputs.result }}** (run inside the workflow)."
            echo
            echo "A pull request opened with \`GITHUB_TOKEN\` does not start workflow runs, so the checks on"
            echo "this pull request may be empty. Two things cover that: the invariant above was verified"
            echo "inside the workflow, and CI was dispatched on this branch — a dispatched run proves the"
            echo "branch is green but does not attach here, so it does not satisfy a required status."
            echo "**Close and reopen this pull request** to get the required checks."
          } > /tmp/pr-body.md

          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh pr list --head "$BRANCH" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            # Edited in place: one pull request that stays accurate is readable, a new one per release is not.
            gh pr edit "$existing" --title "$TITLE" --body-file /tmp/pr-body.md
            echo "Updated #$existing."
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --head "$BRANCH"
          fi

          # Start CI on the branch explicitly. A pull request opened with `GITHUB_TOKEN` does not start
          # workflow runs, so without this the branch has no run at all and the only evidence is the
          # in-workflow check above.
          #
          # Stated precisely because the distinction decides whether a human has to do something: a
          # dispatched run does NOT attach to the pull request and so does NOT satisfy a required status.
          # It proves the branch is green; closing and reopening the pull request is what produces the
          # required checks. Never fatal — the version is already published and recorded by this point,
          # and a dispatch that fails to start is not a reason to fail the release.
          if gh workflow run ci.yml --ref "$BRANCH" 2>/dev/null; then
            echo "Dispatched CI on $BRANCH (does not attach to the pull request)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not dispatch CI on $BRANCH. The pull request has no run of its own; close and reopen it to get one."
          fi
