name: Merge generated version record

on:
  workflow_run:
    workflows: [CI, Publish]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  merge:
    name: Merge verified version record
    if: vars.AUTOMATION_APP_BOT_LOGIN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: generated-version-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check the generated proposal and merge it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT_LOGIN: ${{ vars.AUTOMATION_APP_BOT_LOGIN }}
          BRANCH: chore/record-published-version
        run: |
          set -euo pipefail

          proposals=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --limit 2 --json number)
          if [ "$(jq 'length' <<< "$proposals")" != 1 ]; then
            exit 0
          fi
          pr=$(jq -r '.[0].number' <<< "$proposals")
          pull=$(gh api "repos/$REPO/pulls/$pr")
          author_login=$(jq -r '.user.login' <<< "$pull")

          proposal=$(gh pr view "$pr" --repo "$REPO" \
            --json baseRefName,changedFiles,files,headRefName,headRefOid,headRepository,isDraft,mergeable,reviewDecision,statusCheckRollup)

          if ! jq -e --arg author "$author_login" --arg bot "$BOT_LOGIN" --arg repo "$REPO" --arg branch "$BRANCH" '
            $author == $bot and .baseRefName == "main" and
            .headRefName == $branch and .headRepository.nameWithOwner == $repo and
            .isDraft == false and .mergeable == "MERGEABLE" and
            .reviewDecision != "CHANGES_REQUESTED" and
            .changedFiles == 2 and (.files | length) == 2 and
            ([.files[].path] | sort) == ["package-lock.json", "package.json"]
          ' <<< "$proposal" >/dev/null; then
            echo "Generated version proposal #$pr is not mergeable yet."
            exit 0
          fi

          set +e
          PR="$pr" PROPOSAL="$proposal" CI_WORKFLOW=.github/workflows/ci.yml node scripts/generated-pr-ci.mjs
          check_status=$?
          set -e
          if [ "$check_status" = 3 ]; then exit 0; fi
          if [ "$check_status" != 0 ]; then exit "$check_status"; fi
          if ! jq -e 'any(.statusCheckRollup[]; .name == "Required CI gate" and .conclusion == "SUCCESS")' <<< "$proposal" >/dev/null; then
            echo "Required CI gate has not passed on #$pr." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sha=$(jq -r '.headRefOid' <<< "$proposal")
          commit_count=$(jq -r '.commits' <<< "$pull")
          if [ "$commit_count" -lt 1 ] || [ "$commit_count" -gt 20 ]; then
            echo "Unexpected commit count on #$pr: $commit_count."
            exit 0
          fi
          while read -r commit; do
            if [ "$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.verified')" != true ]; then
              echo "An unverified commit is present on #$pr."
              exit 0
            fi
          done < <(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" --jq '.[].sha')

          publish_run=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message' |
            sed -n 's/^Publish run: \([0-9][0-9]*\)$/\1/p')
          if [ -z "$publish_run" ] || [ "$(gh api "repos/$REPO/actions/runs/$publish_run" \
            --jq '.name == "Publish" and .conclusion == "success"')" != true ]; then
            echo "The publishing run for #$pr has not passed: https://github.com/$REPO/actions/runs/$publish_run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq -r '.reviewDecision // ""' <<< "$proposal")" != APPROVED ]; then
            gh pr review "$pr" --repo "$REPO" --approve
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$sha"
